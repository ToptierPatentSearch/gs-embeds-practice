<header class="practice-site-header">

  <h1>
    {{ site.title | default: "Top-tier Patent Search" | escape }}
  </h1>

  <nav aria-label="Practice page navigation">

    {% for item in site.data.navigation %}

      <a href="{{ item.url | relative_url }}"
         {% if page.url == item.url %}
           aria-current="page"
         {% endif %}>
        {{ item.title | escape }}
      </a>

    {% endfor %}

  </nav>

</header>
