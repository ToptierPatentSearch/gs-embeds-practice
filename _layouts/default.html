<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>
    {{ page.title | default: "Practice Page" | escape }}
    | Top-tier Patent Search
  </title>

  <!-- Shared CSS -->
  <link rel="stylesheet"
        href="{{ '/assets/css/practice.css' | relative_url }}">

  <!-- Shared JavaScript -->
  <script defer
          src="{{ '/assets/js/practice.js' | relative_url }}">
  </script>

</head>

<body class="practice-layout-page">

  {% include header.html %}

  <main class="practice-layout-content">

    {{ content }}

  </main>

  {% include footer.html %}

</body>

</html>
